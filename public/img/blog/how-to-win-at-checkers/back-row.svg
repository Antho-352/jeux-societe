<text x="604" y="244" font-family="Outfit, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#4B5A54">The single-corner man has one entry square</text><text x="560" y="330" font-family="Outfit, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#4B5A54"><tspan x="560">Red mirrors this: keep 1 and 2,</tspan><tspan x="560" dy="26">the man on 4 can go early.</tspan><tspan x="560" dy="26">Keeping all four back is passive:</tspan><tspan x="560" dy="26">you fight 8 against 10 in the middle.</tspan></text>
